name: wgk

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ubuntu:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Install without a usable Go on PATH
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/wgk-cache"
          mkdir -p "$RUNNER_TEMP/wgk-stubs"
          printf '#!/bin/sh\nexit 127\n' > "$RUNNER_TEMP/wgk-stubs/go"
          chmod +x "$RUNNER_TEMP/wgk-stubs/go"
          export PATH="$RUNNER_TEMP/wgk-stubs:$PATH"

          make install
          test "$(command -v wgk)" = /usr/local/bin/wgk

          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/wgk-stubs/curl"
          chmod +x "$RUNNER_TEMP/wgk-stubs/curl"
          make install
      - name: Start and stop a systemd unit from outside the checkout
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/wgk-config"
          wgk config set interface wgk-smoke
          unit=wg-quick@wgk-smoke.service
          sudo tee "/run/systemd/system/$unit" >/dev/null <<'UNIT'
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          RemainAfterExit=yes
          UNIT
          sudo systemctl daemon-reload
          cd "$RUNNER_TEMP"

          check_status() {
            local expected_status=$1 expected_code=$2 status code=0
            status=$(wgk status) || code=$?
            test "$code" -eq "$expected_code"
            test "$status" = "$expected_status"
          }

          check_status inactive 1
          wgk up
          check_status active 0
          sudo -- /usr/bin/env XDG_CONFIG_HOME="$XDG_CONFIG_HOME" /usr/local/bin/wgk down
          check_status inactive 1
