name: wgk

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ubuntu:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install wgk with setup on Ubuntu
        run: |
          test ! -e /usr/local/bin/wgk
          ./setup.sh
          test "$(command -v wgk)" = /usr/local/bin/wgk
          test -x /usr/lib/go-1.26/bin/go
          cd "$RUNNER_TEMP"
          wgk env > wgk-env.txt
          grep -Fx 'host.os.id=ubuntu' wgk-env.txt
          grep -Fx "build.go.arch=$(dpkg --print-architecture)" wgk-env.txt
          grep -Fx 'build.go.CGO_ENABLED=0' wgk-env.txt
          grep -Fx 'tool.build_go.path=/usr/lib/go-1.26/bin/go' wgk-env.txt
          grep -E '^tool\.build_go\.version=go version go[0-9]' wgk-env.txt
      - run: GOTOOLCHAIN=local /usr/lib/go-1.26/bin/go test ./...
      - name: Skip setup and rebuild with make install
        run: |
          stubs=$(mktemp -d "$RUNNER_TEMP/wgk-stubs.XXXXXXXXXX")
          export WGK_UNEXPECTED_CALLS="$stubs/calls"
          cat > "$stubs/unexpected" <<'STUB'
          #!/bin/sh
          printf '%s\n' "$0" >> "$WGK_UNEXPECTED_CALLS"
          exit 1
          STUB
          chmod +x "$stubs/unexpected"
          for command in apt apt-get apt-cache curl make sudo; do
            ln -s unexpected "$stubs/$command"
          done
          export PATH="$stubs:$PATH"
          ./setup.sh
          test ! -e "$WGK_UNEXPECTED_CALLS"

          rm -- "$stubs/make"
          staging=$(mktemp -d "$RUNNER_TEMP/wgk-stage.XXXXXXXXXX")
          mkdir -p "$staging/usr/local/bin"
          install -m 0755 "$stubs/unexpected" "$staging/usr/local/bin/wgk"
          make install DESTDIR="$staging"
          "$staging/usr/local/bin/wgk" --help >/dev/null
          test ! -e "$WGK_UNEXPECTED_CALLS"
      - name: Start and stop a systemd unit from outside the checkout
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/wgk-config"
          default_interface=$(wgk config list --default --filter interface)
          test "$default_interface" = 'interface=wg0'
          default_path=$(wgk service config path)
          test "$default_path" = /etc/wireguard/wg0.conf
          set_result=$(wgk config set interface wgk-smoke)
          test -z "$set_result"
          user_config=$(wgk config path)
          test "$user_config" = "$XDG_CONFIG_HOME/wireguard-scripts/config.yaml"
          test -f "$user_config"
          configured_interface=$(wgk config get interface)
          test "$configured_interface" = wgk-smoke
          configured_path=$(wgk service config path)
          test "$configured_path" = /etc/wireguard/wgk-smoke.conf
          unit=wg-quick@wgk-smoke.service
          sudo tee "/run/systemd/system/$unit" >/dev/null <<'UNIT'
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          RemainAfterExit=yes
          UNIT
          sudo systemctl daemon-reload
          cd "$RUNNER_TEMP"

          check_status() {
            local expected_status=$1 expected_code=$2 status code=0
            status=$(wgk service status) || code=$?
            test "$code" -eq "$expected_code"
            test "$status" = "$expected_status"
          }

          check_status inactive 1
          wgk service up
          check_status active 0
          sudo -- /usr/bin/env XDG_CONFIG_HOME="$XDG_CONFIG_HOME" /usr/local/bin/wgk service down
          check_status inactive 1
      - name: Read the WireGuard port and compare native checks
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/wgk-config"
          cd "$RUNNER_TEMP"
          port=45555
          printf '[Interface]\nListenPort = %s\n' "$port" > wgk-smoke.conf
          sudo -- mkdir -p /etc/wireguard
          sudo -- install -m 0600 wgk-smoke.conf /etc/wireguard/wgk-smoke.conf

          configured_port=$(wgk port get)
          test "$configured_port" = "$port"
          sudo -- ss --version >/dev/null
          sudo -- iptables --version >/dev/null

          compare_check() {
            local check=$1 native_status=0 wrapper_status=0
            shift
            sudo -- "$@" > native.stdout 2> native.stderr || native_status=$?
            wgk port "$check" > wgk.stdout 2> wgk.stderr || wrapper_status=$?
            if [[ $native_status != "$wrapper_status" ]]; then
              printf '%s returned %s via wgk, expected %s\n' "$check" "$wrapper_status" "$native_status" >&2
              cat wgk.stderr >&2
              return 1
            fi
            diff -u native.stdout wgk.stdout
            diff -u native.stderr wgk.stderr
          }

          compare_check udp ss -H -uln "sport = :$port"
          compare_check iptables iptables -C INPUT -p udp --dport "$port" -j ACCEPT
