name: wgk

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ubuntu:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Install without usable Go or Make on PATH
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/wgk-cache"
          stubs="$RUNNER_TEMP/wgk-stubs"
          mkdir -p "$stubs"
          for tool in go make; do
            printf '#!/bin/sh\nexit 127\n' > "$stubs/$tool"
            chmod +x "$stubs/$tool"
          done
          export PATH="$stubs:$PATH"

          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/install-wgk.sh"
          test "$(command -v wgk)" = /usr/local/bin/wgk

          rm "$stubs/make"
          printf '#!/bin/sh\nexit 1\n' > "$stubs/curl"
          chmod +x "$stubs/curl"
          make -C "$GITHUB_WORKSPACE" install
      - name: Query real systemd from outside the checkout
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/wgk-config"
          mkdir -p "$XDG_CONFIG_HOME/wireguard-scripts"
          printf '%s\n' wgk-smoke > "$XDG_CONFIG_HOME/wireguard-scripts/interface"
          unit=wg-quick@wgk-smoke.service
          sudo tee "/run/systemd/system/$unit" >/dev/null <<'UNIT'
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          RemainAfterExit=yes
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl start "$unit"
          cd "$RUNNER_TEMP"
          status=$(wgk status)
          test "$status" = active

          sudo systemctl stop "$unit"
          code=0
          status=$(wgk status) || code=$?
          test "$code" -eq 1
          test "$status" = inactive
